name: Generate ASCII Artwork

on:
  push 

jobs:
  ascii_job:
    runs-on: ubuntu-latest
    steps:
    - name: checkout Repo
      uses: actions/checkout@v7
    
    - name: List Repo Files
      run: ls -ltra
    
    - name: Execute shell script
      run: |
       chmod +x ./.github/workflows/ascii-script.sh
       ./.github/workflows/ascii-script.sh

   